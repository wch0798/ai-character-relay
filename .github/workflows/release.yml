name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/aic-relay
          cp target/release/aic-relay dist/aic-relay/
          cp -r deploy README.md dist/aic-relay/
          tar -C dist -czf aic-relay-${{ matrix.arch }}-linux.tar.gz aic-relay
      - uses: actions/upload-artifact@v4
        with:
          name: aic-relay-${{ matrix.arch }}
          path: aic-relay-${{ matrix.arch }}-linux.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: aic-relay-*-linux.tar.gz
