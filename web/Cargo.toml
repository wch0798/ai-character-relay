[package]
name = "aic-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "Phone/browser client for AI Character: talks to a home computer's AI through the relay, end-to-end encrypted"

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
