<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집 AI">
<meta name="theme-color" content="#0b0f19">
<title>우리집 AI</title>
<style>
  :root { --bg:#0b0f19; --card:#141a29; --line:#232c42; --text:#e7ecf5; --muted:#8d97ad; --accent:#6c9cff; --ok:#3ecf8e; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
  #app { max-width: 720px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  .page { padding: 18px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  h2 { font-size: 17px; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  input, select, textarea { font: inherit; font-size: 16px; background: #0f1422; color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
  input.digits { font: 700 28px ui-monospace, Menlo, monospace; letter-spacing: 8px; text-align: center; }
  button { font: inherit; font-size: 16px; border-radius: 12px; border: 1px solid var(--line); background: #1b2337; color: var(--text); padding: 10px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b0f19; font-weight: 700; }
  button.small { font-size: 14px; padding: 6px 10px; }
  .composer button { white-space: nowrap; flex-shrink: 0; }
  button:disabled { opacity: .5; }
  button.armed { background: var(--bad); border-color: var(--bad); color: #0b0f19; }
  .row { display: flex; gap: 8px; align-items: center; }
  .notice { padding: 10px 12px; border-radius: 12px; background: rgba(255,107,107,0.12); border: 1px solid rgba(255,107,107,0.4); font-size: 14px; }
  .notice.ok { background: rgba(62,207,142,0.12); border-color: rgba(62,207,142,0.4); }
  ol { margin: 0; padding-left: 20px; } li { margin: 4px 0; }
  #chat { flex: 1; display: flex; flex-direction: column; }
  #messages { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #0b0f19; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.error { align-self: stretch; max-width: 100%; }
  .composer { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { resize: none; max-height: 160px; }
  .bar { display: flex; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .bar select { flex: 1; min-width: 0; font-size: 14px; padding: 8px 10px; }
  .empty { margin: auto; text-align: center; color: var(--muted); padding: 30px; }
</style>
</head>
<body>
<div id="app"><p class="page muted">불러오는 중…</p></div>
<script type="module" src="app.js"></script>
</body>
</html>
