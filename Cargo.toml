[package]
name = "aic-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "AI Character relay server: connects a user's own computers through end-to-end encrypted iroh connections"
license = "MIT OR Apache-2.0"

[dependencies]
iroh-relay = { version = "1.3", features = ["server"] }
iroh-base = "1.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
getrandom = "0.2"
tokio-rustls-acme = "0.9"
tokio-stream = { version = "0.1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
iroh = { version = "1.3", features = ["unstable-net-report"] }
iroh-relay = "1.3"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
